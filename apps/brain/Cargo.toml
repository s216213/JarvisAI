[package]
name = "jarvis-brain"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[features]
default = ["db-sqlite"]
db-sqlite = ["sqlx/sqlite"]
db-postgres = ["sqlx/postgres"]

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
# Keep 0.6.x — axum 0.8 is typed against tower-http 0.6 (0.7 breaks CorsLayer types).
tower-http = { version = "0.6.11", features = ["cors", "trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
argon2 = { version = "0.6.0", features = ["getrandom"] }
password-hash = "0.6.1"
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
dotenvy = "0.15.7"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
dashmap = "6.1"
parking_lot = "0.12"
tokio-stream = "0.1"

[profile.release]
lto = true
codegen-units = 1
