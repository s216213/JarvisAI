services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jarvis

  brain:
    image: ${BRAIN_IMAGE:-ghcr.io/OWNER/jarvis-brain:latest}
    build:
      context: ./apps/brain
      dockerfile: Dockerfile
    env_file:
      - ./apps/brain/.env
    environment:
      DATABASE_URL: postgres://jarvis:jarvis@postgres:5432/jarvis
      LISTEN_ADDR: 0.0.0.0:8080
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - jarvis
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - brain
    networks:
      - jarvis
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  jarvis:
    driver: bridge
