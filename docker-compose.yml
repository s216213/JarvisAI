services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jarvis
    restart: unless-stopped

  brain:
    image: ${BRAIN_IMAGE:-ghcr.io/OWNER/jarvis-brain:latest}
    build:
      context: ./apps/brain
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://jarvis:jarvis@postgres:5432/jarvis
      LISTEN_ADDR: 0.0.0.0:8080
    depends_on:
      postgres:
        condition: service_healthy
    # Bound to loopback — system Caddy on the VM reverse-proxies here.
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - jarvis
    restart: unless-stopped

volumes:
  pgdata:

networks:
  jarvis:
    driver: bridge
