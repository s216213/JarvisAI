name: Deploy Brain

on:
  push:
    branches: [main]
    paths:
      - "apps/brain/**"
      - "packages/protocol/**"
      - "docker-compose.yml"
      - "deploy/caddy/**"
      - ".github/workflows/deploy-brain.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: jarvis-brain

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI Ampere free tier is aarch64; GHA ubuntu-latest is amd64 → must cross-build.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA_TAG="ghcr.io/${OWNER}/${IMAGE_NAME}:${{ github.sha }}"
          LATEST_TAG="ghcr.io/${OWNER}/${IMAGE_NAME}:latest"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/brain
          file: ./apps/brain/Dockerfile
          push: true
          # Override with repo variable BRAIN_PLATFORM=linux/amd64 if the VM is x86_64.
          platforms: ${{ vars.BRAIN_PLATFORM || 'linux/arm64' }}
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.latest_tag }}

      - name: Ensure remote dir + sync compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/jarvis"
          strip_components: 0

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/jarvis
            if [[ ! -f .env ]]; then
              echo "Missing ~/jarvis/.env on the VM."
              echo "Create it from apps/brain/.env.example (JWT_SECRET, LLM keys, bootstrap admin, CORS_ORIGINS)."
              exit 1
            fi
            if [[ ! -f docker-compose.yml ]]; then
              echo "Missing ~/jarvis/docker-compose.yml"
              exit 1
            fi
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export BRAIN_IMAGE='${{ steps.meta.outputs.sha_tag }}'
            docker compose pull brain
            docker compose up -d postgres brain
            docker image prune -f
